[workspace]
resolver = "2"
members = [
    "crates/adapter-model",
    "crates/adapter-store-contract",
    "crates/adapter-core",
    "crates/protocol-a2a-mapper",
    "crates/protocol-acp-mapper",
    "crates/driver-stdio",
    "crates/driver-http-sse",
    "crates/driver-mcp",
    "crates/driver-a2a-client",
    "crates/driver-acp-client",
    "crates/memory-task-store",
    "crates/sqlite-task-store-adapter",
    "crates/postgres-task-store-adapter",
    "crates/protocol-a2a-server",
    "crates/protocol-acp-runtime",
    "crates/adapterd", "crates/adapterctl", "crates/driver-a2a-client", "crates/driver-acp-client",
    "crates/anp-transport",
    "crates/protocol-anp-profile",
    "crates/driver-anp-client",
]

[workspace.package]
version = "0.7.2"
edition = "2021"
license = "BSL-1.1"
repository = "https://github.com/GG-QandV/agent-connector"

# A2A SDK — pinned commit (см. docs/design/a2a-sdk-pinned-dependencies.toml).
[workspace.dependencies.a2a]
package = "a2a-lf"
git = "https://github.com/a2aproject/a2a-rs.git"
rev = "02ee56024a485a5f184cbc55d1706918ee1ff809"

[workspace.dependencies.a2a-pb]
package = "a2a-pb"
git = "https://github.com/a2aproject/a2a-rs.git"
rev = "02ee56024a485a5f184cbc55d1706918ee1ff809"

[workspace.dependencies.a2a-server]
package = "a2a-server-lf"
git = "https://github.com/a2aproject/a2a-rs.git"
rev = "02ee56024a485a5f184cbc55d1706918ee1ff809"
default-features = false

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
futures-util = "0.3"
http-body-util = "0.1"
rand = "0.9"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "signal"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

adapter-model = { path = "crates/adapter-model" }
adapter-store-contract = { path = "crates/adapter-store-contract" }
adapter-core = { path = "crates/adapter-core" }
protocol-a2a-mapper = { path = "crates/protocol-a2a-mapper" }
protocol-acp-mapper = { path = "crates/protocol-acp-mapper" }
protocol-a2a-server = { path = "crates/protocol-a2a-server" }
protocol-acp-runtime = { path = "crates/protocol-acp-runtime" }
driver-stdio = { path = "crates/driver-stdio" }
driver-http-sse = { path = "crates/driver-http-sse" }
driver-mcp = { path = "crates/driver-mcp" }
driver-a2a-client = { path = "crates/driver-a2a-client" }
driver-acp-client = { path = "crates/driver-acp-client" }
anp-transport = { path = "crates/anp-transport" }
protocol-anp-profile = { path = "crates/protocol-anp-profile" }
driver-anp-client = { path = "crates/driver-anp-client" }
memory-task-store = { path = "crates/memory-task-store" }
sqlite-task-store-adapter = { path = "crates/sqlite-task-store-adapter" }
postgres-task-store-adapter = { path = "crates/postgres-task-store-adapter" }
