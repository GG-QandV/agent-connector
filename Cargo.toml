[workspace]
resolver = "2"
members = [
    "crates/adapter-model",
    "crates/adapter-store-contract",
    "crates/adapter-core",
    "crates/protocol-a2a-mapper",
    "crates/protocol-acp-mapper",
    "crates/driver-stdio",
    "crates/driver-http-sse",
    "crates/memory-task-store",
    "crates/sqlite-task-store-adapter",
    "crates/postgres-task-store-adapter",
    "crates/adapterd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSL-1.1"
repository = "https://github.com/GG-QandV/agent-connector"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

adapter-model = { path = "crates/adapter-model" }
adapter-store-contract = { path = "crates/adapter-store-contract" }
adapter-core = { path = "crates/adapter-core" }
protocol-a2a-mapper = { path = "crates/protocol-a2a-mapper" }
protocol-acp-mapper = { path = "crates/protocol-acp-mapper" }
driver-stdio = { path = "crates/driver-stdio" }
driver-http-sse = { path = "crates/driver-http-sse" }
memory-task-store = { path = "crates/memory-task-store" }
sqlite-task-store-adapter = { path = "crates/sqlite-task-store-adapter" }
postgres-task-store-adapter = { path = "crates/postgres-task-store-adapter" }
