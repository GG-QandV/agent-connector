# adapterd — пример конфигурации.
# Скопируйте в adapter.yaml (или укажите путь аргументом) и задайте секреты
# через переменные окружения — никогда не коммитьте реальные значения.

mode: local            # local | remote

storage:
  type: sqlite         # memory | sqlite | postgres
  path: ./data/adapter.db

# storage:
#   type: postgres
#   dsn_env: ADAPTER_PG_DSN
#   schema: agent_adapter
#   max_connections: 10

runtime:
  max_concurrent_tasks: 32
  cleanup_interval_seconds: 3600
  shutdown_grace_seconds: 30

# Bearer-token аутентификация JSON-RPC inbound.
# Пусто (по умолчанию) = auth отключена (AllowAllPolicy).
# Секрет — только имя env-переменной, значение никогда не кладётся в конфиг.
auth:
  bearer_tokens:
    - token_env: ADAPTER_BEARER_TOKEN
      caller_id: primary-client
      allowed_scopes: []

retention:
  task_ttl_days: 7
  event_ttl_days: 7
  idempotency_ttl_hours: 24
  cleanup_batch_size: 1000

agents:
  - id: stdio-agent
    skills: [code-review]
    limits:
      max_concurrent_tasks: 4
      max_queued_tasks: 32
      max_input_bytes: 1048576
      max_event_bytes: 262144
      default_timeout_seconds: 900
    driver: stdio
    command: ./agent
    args: []
    working_dir: null
    env: {}

  # - id: remote-agent
